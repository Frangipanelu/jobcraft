[project]
name = "jobcraft"
version = "0.6.0"
description = "JobCraft 求职助手 — AI 驱动的简历优化、岗位分析与面试准备工具。"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiofiles>=23.0.0",
    "fastapi>=0.100.0",
    "langchain==1.2.17",
    "langchain-community>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-openai==1.2.1",
    "langgraph==1.1.10",
    "mysql-connector-python>=8.0.0",
    "openai>=1.0.0",
    "pandas>=2.0.0",
    "prometheus-client>=0.19.0",
    "prometheus-fastapi-instrumentator>=6.0.0",
    "pydantic>=2.0.0",
    "pypdf>=3.0.0",
    "python-docx>=1.0.0",
    "python-dotenv==1.2.2",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.6",
    "passlib[bcrypt]>=1.7.4",
    "reportlab>=4.0.0",
    "requests>=2.31.0",
    "tavily-python==0.7.24",
    "typing-extensions>=4.5.0",
    "uvicorn[standard]>=0.20.0",
]

[dependency-groups]
dev = [
    "ruff>=0.5.0",
    "pytest>=8.0.0",
    "playwright>=1.62.0",
]

[tool.uv]
package = false

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["S104", "S105", "S110", "S112", "S608", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "W291", "W293"]
