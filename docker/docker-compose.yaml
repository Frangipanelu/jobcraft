# JobCraft 本地开发环境
#
# 启动方式：
#   开发模式（仅 MySQL）：docker compose -f docker/docker-compose.yaml up -d mysql
#   生产模式（全部服务）：docker compose -f docker/docker-compose.yaml up -d --build

name: jobcraft

services:
  mysql:
    image: mysql:8.4
    container_name: jobcraft-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-root}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-jobcraft}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      - --sql-mode=TRADITIONAL
    ports:
      - "3308:3306"
    volumes:
      - jobcraft_mysql_data:/var/lib/mysql
      - ./mysql/jobcraft.sql:/docker-entrypoint-initdb.d/01-init-jobcraft.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: jobcraft-backend
    restart: unless-stopped
    env_file: ../.env
    environment:
      MYSQL_HOST: mysql
      ALLOWED_ORIGINS: http://localhost,http://localhost:80,http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ../output:/app/output
      - ../updated:/app/updated

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: jobcraft-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  jobcraft_mysql_data:
